discrepancies:
  - id: D1
    severity: critical
    task: REL-02
    status: closed
    package: animus-kernel
    description: Kernel imports animus_types throughout the codebase but does not declare animus-types as a runtime dependency.
    evidence:
      - "Grep finds from animus_types in packages/kernel/src/animus_kernel/memory/types.py, providers/base.py, network/egress.py, etc."
      - "Clean-room 'pip install animus-kernel' allows root import but fails on animus_kernel.memory.types, providers.base, network.egress."
      - "packages/kernel/src/animus_types/ is a vendored copy that is not included in the wheel."
    fix:
      - "Added animus-types>=0.1.0,<1 to packages/kernel/pyproject.toml dependencies"
      - "Removed vendored packages/kernel/src/animus_types/ directory"
      - "Updated CI/publish workflows to install animus-types alongside kernel"
      - "Clean-room full-resolution install now passes real module imports"

  - id: D2
    severity: critical
    task: REL-02
    status: closed
    package: animus-contracts
    description: Contracts imports animus_types.ValidationError but does not declare animus-types; schemas are not packaged in the wheel.
    evidence:
      - "validator.py line 23: from animus_types import ValidationError"
      - "Wheel contains only animus_contracts/__init__.py and validator.py; no *.schema.json files."
      - "Even with animus-types+pydantic installed, _SCHEMA_STORE is empty because schemas are not next to the installed module."
    fix:
      - "Added animus-types>=0.1.0,<1 to packages/contracts/pyproject.toml dependencies"
      - "Moved all *.schema.json into packages/contracts/src/animus_contracts/schemas"
      - "Updated validator.py, __init__.py, tests, and scripts to load from the packaged schemas directory"
      - "Clean-room full-resolution install now imports and loads all 25 schemas"

  - id: D3
    severity: high
    task: REL-01
    status: closed
    package: animus-quorum
    description: Quorum native Rust extension is not built into the wheel despite classifiers and optional rust extra.
    evidence:
      - "packages/quorum/python/animus_quorum/_core.cpython-312-x86_64-linux-gnu.so exists in source tree."
      - "Wheel contains no .so/.dylib/.dll/_core artifacts."
      - "Build backend is setuptools, not maturin or setuptools-rust."

  - id: D4
    severity: high
    task: REL-01
    status: closed
    package: animus-quorum
    description: Quorum still carries stale convergent identity artifacts.
    evidence:
      - "Empty python/convergent directory and convergentAI.egg-info/ remain in the repo."
      - "pyproject.toml ruff per-file-ignores reference 'python/convergent/contract.py'."
      - "coverage.run omits reference 'python/convergent/semantic.py' and 'python/convergent/demo.py'."

  - id: D5
    severity: critical
    task: REL-02
    status: closed
    package: animus-core
    description: "extras[all] references the wrong distribution name 'animus', causing pip to install an unrelated PyPI package."
    evidence:
      - "pyproject.toml line: all = ['animus[anthropic,openai,api,voice,integrations,sync,mcp,dev]']"
      - "pip install 'animus-core[all]' from wheelhouse fetched and installed 'animus-0.0.2' from PyPI."
      - "This creates a dependency-confusion / shadowing risk for the animus import root."
    fix:
      - "Corrected extras[all] to 'animus-core[anthropic,openai,api,voice,integrations,sync,mcp,dev]'"
      - "Local wheel no longer resolves to unrelated PyPI package 'animus-0.0.2'"
      - "PyPI animus-core 2.3.0 still carries the old metadata; new release required"

  - id: D6
    severity: high
    task: REL-04
    package: animus-workspace
    description: Monorepo Python support claims are inconsistent.
    evidence:
      - "Root/animus-types/animus-quorum/animus-core declare >=3.10."
      - "animus-kernel and animus-bootstrap declare >=3.11."
      - "animus-forge declares >=3.12."
      - "Full-stack install therefore requires >=3.12, but docs may claim 3.11+."

  - id: D7
    severity: medium
    task: REL-04
    package: animus-core
    description: Core claims Production/Stable while packaging and maturity evidence are incomplete.
    evidence:
      - "Classifier 'Development Status :: 5 - Production/Stable'."
      - "Open critical/higher-priority issues remain in REL-02 and core[all] distribution bug."

  - id: D8
    severity: medium
    task: REL-05
    package: animus-bootstrap
    description: Broad async warning suppression in pytest config.
    evidence:
      - "filterwarnings ignores PytestUnraisableExceptionWarning and RuntimeWarning for 'coroutine was never awaited'."

  - id: D9
    severity: medium
    task: REL-04
    package: animus-workspace
    description: docs-deploy.yml uses invalid action versions.
    evidence:
      - "actions/checkout@v7 and actions/setup-python@v7 do not exist; current latest major is v4 for setup-python and v4 for checkout."

  - id: D10
    severity: medium
    task: REL-07
    status: closed
    package: animus-kernel
    description: Kernel publish workflow builds from an editable install that does not include animus-types.
    evidence:
      - "publish-kernel.yml runs 'pip install -e packages/kernel/' with no sibling packages."
      - "Editable install can import the vendored src/animus_types, hiding the missing declared dependency."
    fix:
      - "Updated publish-kernel.yml and publish-kernel-testpypi.yml to install animus-types alongside kernel"

  - id: D11
    severity: medium
    task: REL-07
    package: animus-forge
    description: Forge publish workflow builds from an editable install that does not include kernel/quorum.
    evidence:
      - "publish-forge.yml runs 'pip install -e packages/types/ -e packages/forge/[dev]'."
      - "Runtime deps animus-kernel and animus-quorum are not editable-installed before build."

  - id: D12
    severity: low
    task: REL-06
    package: animus-core
    description: README/tool counts and install commands are manually maintained and drift-prone.
    evidence:
      - "Plan problem statement #14; no generated truth file currently exists."

ci_matrix_alignment:
  status: partial
  notes:
    - "All publish workflows pin setup-python@v6 with python-version 3.12."
    - "CI test matrices not fully generated from package-matrix.yaml; root pytest pythonpath uses source paths."
    - "No CI job currently fails when Quorum native tests skip."
    - "docs-deploy.yml action versions fixed to checkout@v4 and setup-python@v5 (REL-04 closed); GitHub Pages deployment still blocked for private repos."
    - "Python support claims aligned to >=3.12 across root workspace and all packages (REL-04 closed)."

