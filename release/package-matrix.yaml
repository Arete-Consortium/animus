# Animus release baseline — REL-00 through REL-04 package compatibility matrix
# Generated: 2026-07-31
# Last refreshed: 2026-08-01
# Baseline git revision: 712994deb4ddba359f0b0931fef131c0edeff25a
# Method: python -m build per package; wheel/sdist inspection; clean-room venv smoke tests

baseline:
  date: "2026-08-01"
  git_rev: "712994d"
  plan_baseline: "6338784561efa6395fb83072318ff7771284842f"
  test_runner: "local x86_64, Python 3.12"
  artifact_dir: "/tmp/animus-rel00/wheelhouse"

supported_profiles:
  - id: types-only
    name: Shared types
    python_floor: ">=3.12"
    install: "pip install animus-types"
  - id: contracts-only
    name: Contracts validator
    python_floor: ">=3.12"
    install: "pip install animus-contracts"
  - id: kernel-only
    name: Kernel runtime
    python_floor: ">=3.12"
    install: "pip install animus-kernel"
  - id: core-only
    name: Core exocortex
    python_floor: ">=3.12"
    install: "pip install animus-core"
  - id: forge-only
    name: Forge orchestration
    python_floor: ">=3.12"
    install: "pip install animus-forge"
  - id: bootstrap-only
    name: Bootstrap installer
    python_floor: ">=3.12"
    install: "pip install animus-bootstrap"
  - id: quorum-only
    name: Quorum coordination
    python_floor: ">=3.12"
    install: "pip install animus-quorum"
  - id: full-local-stack
    name: Full local stack
    python_floor: ">=3.12"
    install: "pip install --find-links <wheelhouse> <all local wheels>"
    note: "Works when all wheels are co-installed; individual packages do not all install cleanly"
  - id: full-dev-stack
    name: Full development stack
    python_floor: ">=3.12"
    install: "editable monorepo install (not a distributable product)"

