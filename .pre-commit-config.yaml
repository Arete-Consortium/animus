# See https://pre-commit.com for usage and installation.
# Run `pre-commit install` once after cloning.
# Run `pre-commit run --all-files` to check everything manually.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # Preserve hashed source evidence, including Markdown hard line breaks.
        exclude: ^integrations/hunter_review/sources/
      - id: end-of-file-fixer
        exclude: ^integrations/hunter_review/sources/
      - id: check-yaml
        exclude: ^PORTFOLIO_MANIFEST\.yaml$
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key
        exclude: ^(docs/cookbook/|packages/bootstrap/tests/test_push\.py|packages/core/tests/test_redaction\.py)
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^packages/_archive/
      - id: ruff-format
        exclude: ^packages/_archive/
