name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'LICENSE'
      - '.gitignore'
      - '.github/dependabot.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'LICENSE'
      - '.gitignore'
      - '.github/dependabot.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  boundary-imports:
    name: Boundary Import Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: "3.12"

      - name: Check boundary imports
        run: python3 scripts/check_boundary_imports.py

  version-alignment:
    name: Version Alignment Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: "3.12"

      - name: Check version alignment
        run: python3 scripts/check_version_alignment.py

  docs:
    name: Docs Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Run docs validation
        run: |
          python3 scripts/docs-validate.py


  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint all packages
        run: ruff check packages/ --exclude packages/_archive/

      - name: Format check
        run: ruff format --check packages/ --exclude packages/_archive/

  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: "3.12"

      - name: Cache pre-commit hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: ${{ runner.os }}-pre-commit-

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  schema-validate:
    name: Schema Validation Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install -e packages/types/ -e packages/contracts/

      - name: Validate schemas
        run: python3 scripts/validate_schemas.py

  contracts:
    name: Contract Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install -e packages/types/ -e "packages/contracts/[dev]"

      - name: Validate contracts
        run: python scripts/validate_contracts.py

      - name: Test generated types
        run: |
          pip install pytest
          pytest packages/types/tests/test_schemas.py -v --tb=short

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-mypy-${{ hashFiles('packages/*/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-mypy-

      - name: Install dependencies
        run: |
          pip install -e packages/types/
          pip install -e "packages/kernel/[dev]"
          pip install -e "packages/quorum/[dev]"
          pip install -e "packages/core/[dev]"
          pip install -e "packages/forge/[dev]"
          pip install -e "packages/bootstrap/[dev]"
          pip install mypy

      - name: Run mypy on core
        run: |
          mypy packages/core/animus/ \
            --ignore-missing-imports \
            --warn-return-any \
            --warn-unused-configs \
            --pretty

      - name: Run mypy on kernel
        run: |
          mypy packages/kernel/src/animus_kernel/ \
            --ignore-missing-imports \
            --warn-return-any \
            --warn-unused-configs \
            --pretty

      - name: Run mypy on forge
        run: |
          mypy packages/forge/src/animus_forge/ \
            --ignore-missing-imports \
            --warn-return-any \
            --warn-unused-configs \
            --pretty

      - name: Run mypy on bootstrap
        run: |
          mypy packages/bootstrap/src/animus_bootstrap/ \
            --ignore-missing-imports \
            --warn-return-any \
            --warn-unused-configs \
            --pretty

      - name: Mypy ratchet
        run: python3 scripts/mypy-ratchet.py core kernel forge bootstrap

      - name: Upload mypy report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mypy-report
          path: |
            packages/core/mypy-report.txt
            packages/kernel/mypy-report.txt
            packages/forge/mypy-report.txt
            packages/bootstrap/mypy-report.txt
          retention-days: 30

  test-kernel:
    name: Test Kernel (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-kernel-${{ matrix.python-version }}-${{ hashFiles('packages/kernel/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-kernel-${{ matrix.python-version }}-

      - name: Install dependencies
        run: pip install -e packages/types/ -e "packages/kernel/[dev]" fastapi

      - name: Test with coverage
        run: pytest packages/kernel/tests/ -v --tb=short --cov=animus_kernel --cov-report=term-missing --cov-report=xml
        env:
          PYTHONPATH: packages/core

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

      - name: Coverage ratchet
        run: python3 scripts/coverage-ratchet.py kernel

  test-core:
    name: Test Core (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-core-${{ matrix.python-version }}-${{ hashFiles('packages/core/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-core-${{ matrix.python-version }}-

      - name: Install dependencies
        # animus-types is a sibling pip-installable package and is not
        # published to PyPI — pip resolves it from the local path when
        # both -e targets are part of the same install transaction.
        run: pip install -e packages/types/ -e packages/contracts/ -e packages/kernel/ -e "packages/core/[dev,api,postgres,mcp]"

      - name: Test with coverage
        run: pytest packages/core/tests/ -v --tb=short --cov=animus --cov-report=term-missing
        env:
          ANIMUS_SKIP_INTEGRATION_TESTS: "1"

  test-quorum:
    name: Test Quorum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-quorum-${{ hashFiles('packages/quorum/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-quorum-

      - name: Install dependencies
        run: pip install -e "packages/quorum/[dev]"

      - name: Verify native extension is importable
        run: python -c "from animus_quorum._core import IntentGraph; from animus_quorum.rust_backend import HAS_RUST; assert HAS_RUST"

      - name: Native backend tests
        run: pytest packages/quorum/tests/test_rust_backend.py -q --tb=short

      - name: Test with coverage
        run: PYTHONPATH=packages/quorum/python pytest packages/quorum/tests/ -v --tb=short

  test-types:
    name: Test Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-types-${{ hashFiles('packages/types/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-types-

      - name: Install dependencies
        run: pip install -e "packages/types/[dev]"

      - name: Test with coverage
        run: pytest packages/types/tests/ -v --tb=short --cov=animus_types --cov-report=term-missing

  test-contracts:
    name: Test Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-contracts-${{ hashFiles('packages/contracts/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-contracts-

      - name: Install dependencies
        run: pip install -e packages/types/ -e "packages/contracts/[dev]" pytest pytest-cov

      - name: Test with coverage
        run: pytest packages/contracts/tests/ -v --tb=short --cov=animus_contracts --cov-report=term-missing

  test-forge:
    name: Test Forge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-forge-${{ hashFiles('packages/forge/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-forge-

      - name: Install dependencies
        run: |
          pip install -e packages/types/
          pip install -e "packages/quorum/[dev]"
          pip install -e "packages/kernel/[dev]"
          pip install -e "packages/forge/[dev]"

      - name: Test with coverage
        working-directory: packages/forge
        env:
          # animus_forge.api_state imports the OpenAI client at
          # module-load time; pytest collection fails without a key.
          # Dummy values are sufficient — the suite does not make
          # real network calls.
          OPENAI_API_KEY: "sk-dummy-ci-no-network-calls"
          ANTHROPIC_API_KEY: "sk-dummy-ci-no-network-calls"
        run: pytest tests/ -v --tb=short --cov=animus_forge --cov-report=term-missing

  test-bootstrap:
    name: Test Bootstrap (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-bootstrap-${{ matrix.python-version }}-${{ hashFiles('packages/bootstrap/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-bootstrap-${{ matrix.python-version }}-

      - name: Install dependencies
        run: pip install -e "packages/bootstrap/[dev,push]"

      - name: Test with coverage
        run: pytest packages/bootstrap/tests/ -v --tb=short --cov=animus_bootstrap --cov-report=term-missing
        env:
          PYTHONPATH: packages/bootstrap/src

  test-database:
    name: Test Database (PostgreSQL ${{ matrix.postgres-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres-version: ["14", "15", "16"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: animus_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install sqlalchemy alembic pytest psycopg2-binary

      - name: Test migrations (SQLite)
        working-directory: database
        run: pytest tests/ -v --tb=short -k "not postgres"

      - name: Test migrations (PostgreSQL)
        working-directory: database
        run: |
          export TEST_DATABASE_URL="postgresql://postgres:testpass@localhost/animus_test"
          pytest tests/ -v --tb=short -k "postgres or integration"

      - name: Install registry integration dependencies
        run: |
          pip install -e packages/types/ -e packages/contracts/ -e "packages/core/[postgres]"
          pip install --no-deps -e packages/kernel/

      - name: Test shared registry on PostgreSQL
        env:
          HUNTER_TEST_DATABASE_URL: postgresql://postgres:testpass@localhost/animus_test
        run: pytest packages/core/tests/test_registry_compatibility.py -v --tb=short

  test-pwa:
    name: Test PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-pwa-${{ hashFiles('packages/pwa/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-pwa-

      - name: Install dependencies
        working-directory: packages/pwa
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Vitest
        working-directory: packages/pwa
        run: npm run test

  test-integration:
    name: Test Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e packages/types/
          pip install -e "packages/kernel/[dev]"
          pip install -e "packages/contracts/[dev]"

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short

  docker:
    name: Docker Build (Kernel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build multi-arch kernel image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/kernel/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: animus-kernel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test import inside container (amd64)
        run: docker run --rm --platform linux/amd64 animus-kernel:ci python -c "import animus_kernel; print('OK amd64')"

      - name: Test CLI inside container (amd64)
        run: docker run --rm --platform linux/amd64 animus-kernel:ci python -m animus_kernel --help

  sbom:
    name: Generate SBOMs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [core, kernel, forge, bootstrap, types, contracts, quorum]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        if: matrix.package == 'quorum'
        uses: dtolnay/rust-toolchain@stable

      - name: Install package and SBOM tools
        run: |
          case "${{ matrix.package }}" in
            core|kernel|forge|contracts)
              pip install -e packages/types/
              ;;
          esac
          if [[ "${{ matrix.package }}" == "forge" ]]; then
            pip install -e "packages/quorum/[dev]"
            pip install -e "packages/kernel/[dev]"
          fi
          pip install -e "packages/${{ matrix.package }}/" pip-licenses cyclonedx-bom

      - name: Generate license CSV
        run: |
          pip-licenses --format=csv --output-file=sbom-${{ matrix.package }}-licenses.csv

      - name: Generate CycloneDX SBOM
        run: |
          cyclonedx-py environment -o sbom-${{ matrix.package }}.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sbom-${{ matrix.package }}
          path: |
            sbom-${{ matrix.package }}.json
            sbom-${{ matrix.package }}-licenses.csv
          retention-days: 90

  security:
    name: Security
    runs-on: ubuntu-latest
    # gitleaks-action@v2 calls /repos/:owner/:repo/pulls/:id/commits on PR
    # events, which requires pull-requests: read. Without this, the action
    # fails with 403 "Resource not accessible by integration".
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [type-check, test-kernel, test-core, test-quorum, test-types, test-contracts, test-forge, test-bootstrap, test-database, test-pwa, test-integration, docker, security]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-bench-${{ hashFiles('packages/*/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-bench-

      - name: Install all packages
        run: |
          pip install -e packages/types/
          pip install -e "packages/quorum/[dev]"
          pip install -e "packages/forge/[dev]"
          pip install -e "packages/kernel/[dev]"
          pip install -e "packages/core/[dev,api]"

      - name: Create benchmarks output directory
        run: mkdir -p .benchmarks

      - name: Run Core benchmarks
        run: >
          pytest packages/core/tests/test_benchmarks.py
          --benchmark-only --benchmark-disable-gc --benchmark-warmup=on
          --benchmark-json=.benchmarks/core.json -q

      - name: Run Forge benchmarks
        working-directory: packages/forge
        run: >
          pytest tests/test_benchmarks.py
          --benchmark-only --benchmark-disable-gc --benchmark-warmup=on
          --benchmark-json=../../.benchmarks/forge.json -q

      - name: Run Quorum benchmarks
        run: >
          PYTHONPATH=packages/quorum/python pytest packages/quorum/tests/test_benchmarks.py
          --benchmark-only --benchmark-disable-gc --benchmark-warmup=on
          --benchmark-json=.benchmarks/quorum.json -q
        env:
          PYTHONPATH: packages/quorum/python

      - name: Run Kernel benchmarks
        run: >
          pytest packages/kernel/tests/test_benchmarks.py
          --benchmark-only --benchmark-disable-gc --benchmark-warmup=on
          --benchmark-json=.benchmarks/kernel.json -q

      - name: Merge benchmark results
        run: |
          python3 -c "
          import json, glob
          merged = {'benchmarks': []}
          for f in sorted(glob.glob('.benchmarks/*.json')):
              data = json.load(open(f))
              pkg = f.split('/')[-1].replace('.json', '')
              for b in data.get('benchmarks', []):
                  b['group'] = pkg
                  merged['benchmarks'].append(b)
          merged['machine_info'] = data.get('machine_info', {})
          merged['commit_info'] = data.get('commit_info', {})
          merged['datetime'] = data.get('datetime', '')
          json.dump(merged, open('.benchmarks/merged.json', 'w'), indent=2)
          print(f'Merged {len(merged[\"benchmarks\"])} benchmarks')
          "

      - name: Profile kernel benchmarks
        run: python3 scripts/profile_benchmarks.py .benchmarks

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: pytest
          output-file-path: .benchmarks/merged.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '105%'
          fail-on-alert: true
          comment-on-alert: true
          benchmark-data-dir-path: dev/bench

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: benchmark-results
          path: .benchmarks/
          retention-days: 90

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_CICD }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_CICD not set — skipping notify"
            exit 0
          fi
          STATUS="${{ job.status }}"
          COLOR=$([ "$STATUS" = "success" ] && echo 3066993 || echo 15158332)
          ICON=$([ "$STATUS" = "success" ] && echo "✅" || echo "❌")
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"$ICON ${{ github.repository }}\",\"description\":\"Branch: ${{ github.ref_name }} | Status: $STATUS\",\"color\":$COLOR}]}"
