name: Publish Kernel (animus-kernel)

on:
  push:
    tags: ["kernel-v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # animus-types is a sibling pip-installable package not on
        # PyPI; pip resolves it locally when both -e targets share the
        # same install transaction.
        run: pip install -e packages/types/ -e "packages/kernel/"

      - name: Build package
        run: |
          pip install build
          python -m build packages/kernel/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/kernel/dist/

      - name: Extract release notes
        id: changelog
        run: |
          VERSION=${GITHUB_REF_NAME#kernel-v}
          awk "/^## \[$VERSION\]/{flag=1;next}/^## \[/{flag=0}flag" packages/kernel/CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section found for $VERSION; falling back to auto-generated notes."
            echo "body=" >> "$GITHUB_OUTPUT"
          else
            echo "body<<EOF" >> "$GITHUB_OUTPUT"
            cat release-notes.md >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          generate_release_notes: ${{ steps.changelog.outputs.body == '' }}
          body: ${{ steps.changelog.outputs.body }}
          files: |
            packages/kernel/dist/*
            packages/kernel/CHANGELOG.md
