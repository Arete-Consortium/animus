name: Security

on:
  push:
    branches: [main, "codex/hunter-os-*"]
  pull_request:
    branches: [main, "codex/hunter-os-*"]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  pip-audit:
    name: Dependency Audit (${{ matrix.package }}${{ matrix.extra && format('[ {0} ]', matrix.extra) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [core, forge, kernel, contracts, quorum, bootstrap]
        extra: [""]
        include:
          - package: core
            extra: chroma
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: "3.12"
      - name: Upgrade pip (fixes CVE-2026-6357)
        run: pip install --upgrade "pip>=26.1"
      - name: Install dependencies
        run: |
          if [[ "${{ matrix.package }}" == "core" || "${{ matrix.package }}" == "forge" || "${{ matrix.package }}" == "kernel" || "${{ matrix.package }}" == "contracts" ]]; then
            pip install -e packages/types/
          fi
          if [[ "${{ matrix.package }}" == "forge" ]]; then
            pip install -e "packages/quorum/[dev]"
            pip install -e "packages/kernel/[dev]"
          fi
          pip install -e "packages/${{ matrix.package }}/" pip-audit
          if [[ "${{ matrix.extra }}" == "chroma" ]]; then
            pip install -e "packages/core/[chroma]"
          fi
      - name: Upgrade vulnerable transitive deps to fix versions
        # These are pulled in transitively (via pip-audit and dev tooling);
        # forcing the fix versions here cleans the audit without touching
        # any package's production dependency block.
        run: |
          pip install --upgrade \
            "idna>=3.15" \
            "pillow>=12.2.0" \
            "pygments>=2.20.0" \
            "requests>=2.33.0" \
            "urllib3>=2.7.0"
      - name: Run pip-audit
        # CVE-2026-3219 has no fix version available in pip itself.
        # Re-evaluate when upstream ships a fix.
        # Chroma is an optional legacy profile. Audit it explicitly: the
        # HttpClient path means an embedded-only exception is not valid.
        # This profile remains blocked until upstream supplies a verified fix.
        run: pip-audit --ignore-vuln CVE-2026-3219
