[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "animus-core"
version = "2.3.0"
description = "An exocortex architecture for personal cognitive sovereignty"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "AreteDriver"}
]
keywords = ["ai", "personal-assistant", "exocortex", "llm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "ollama>=0.1.0,<1",
    "chromadb>=0.4.22",
    "pyyaml>=6.0,<7",
    "pydantic>=2.6.0,<3",
    "rich>=13.7.0,<15",
    "prompt-toolkit>=3.0.43,<4",
    # ed25519 signing/verification for the integrity baseline (C1-8). Used by
    # animus.integrity.checker to sign the baseline at regenerate time and
    # verify the detached signature before trusting it at daemon boot.
    # Pinned to match forge (>=48.0.1) — fixes GHSA-537c-gmf6-5ccf.
    # Earlier ranges: 45.0.7 carried PYSEC-2026-35/36 + CVE-2026-26007
    # (fixed by 46.0.x); 46.0.7 carried GHSA-537c-gmf6-5ccf (fixed by 48.0.1).
    "cryptography>=48.0.1",
    # Shared types — sibling package in the monorepo. Editable-installed
    # from ``packages/types/`` during development; satisfied by pip's
    # local resolution when ``packages/types/`` is part of the same
    # ``pip install -e ...`` invocation. Hard requirement: every
    # ``from animus_types import Sensitivity`` site in core would crash
    # without it.
    "animus-types>=0.1.0,<1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.18.0"]
openai = ["openai>=1.12.0"]
hybrid-search = ["rank-bm25>=0.2.2"]
api = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
]
voice = [
    "openai-whisper>=20231117",
    "pyttsx3>=2.90",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
]
integrations = [
    "google-api-python-client>=2.100.0",
    "google-auth>=2.20.0",
    "google-auth-oauthlib>=1.0.0",
    "todoist-api-python>=2.0.0",
]
sync = [
    "websockets>=12.0",
    "zeroconf>=0.131.0",
]
mcp = ["mcp>=1.0.0"]
postgres = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "httpx>=0.26.0",
]
all = ["animus-core[anthropic,openai,api,voice,integrations,sync,mcp,dev]"]

[project.scripts]
animus = "animus.__main__:main"

[project.urls]
Homepage = "https://github.com/AreteDriver/animus"
Repository = "https://github.com/AreteDriver/animus"
Documentation = "https://github.com/AreteDriver/animus#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["animus*"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["animus/autonomous-loop.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # Line length handled separately

[tool.ruff.lint.per-file-ignores]
"animus/citizens/architect.py" = ["F841"]
"animus/citizens/architecture_citizen.py" = ["F841"]
"animus/citizens/first_principles.py" = ["F841"]
"animus/citizens/harvester.py" = ["F401"]
"animus/citizens/intelligence.py" = ["F841"]
"animus/citizens/knowledge_curator.py" = ["F841"]
"animus/citizens/pattern.py" = ["F841"]
"animus/dossier/graph.py" = ["N806"]
"tests/test_bootstrap_mvp.py" = ["F841"]
"tests/test_citizen_council.py" = ["F841"]
"tests/test_citizens.py" = ["F841"]
"tests/test_daemon.py" = ["F841"]
"tests/test_discovery.py" = ["F841"]
"tests/test_media_pipeline.py" = ["F841"]
"tests/test_session_steward.py" = ["F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]  # assert used in tests

[tool.coverage.run]
source = ["animus"]
branch = true
omit = ["animus/__main__.py", "animus/api.py", "animus/dashboard.py"]

[tool.coverage.report]
fail_under = 97
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "@abstractmethod",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
