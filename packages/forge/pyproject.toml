[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "animus-forge"
version = "1.9.0"
description = "Multi-agent orchestration framework for production AI workflows"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "AreteDriver"}
]
keywords = ["multi-agent", "ai", "orchestration", "workflow"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "openai>=2.15.0,<3",
    "anthropic>=0.79.0,<1",
    "fastapi>=0.128.0,<1",
    "uvicorn>=0.40.0,<1",
    "streamlit>=1.53.0,<2",
    "google-auth>=2.35.0,<3",
    "google-auth-oauthlib>=1.2.0,<2",
    "google-auth-httplib2>=0.3.0,<1",
    "google-api-python-client>=2.150.0,<3",
    "notion-client>=3.0.0,<4",
    "PyGithub>=2.4.0,<3",
    "pydantic>=2.12.0,<3",
    "pydantic-settings>=2.13.0,<3",
    "python-dotenv>=1.0.0,<2",
    "requests>=2.32.0,<3",
    "aiofiles>=25.1.0,<26",
    "apscheduler>=3.11.0,<4",
    "urllib3>=2.6.0,<3",
    "pynacl>=1.6.0,<2",
    "pyasn1>=0.6.1,<1",
    "typer>=0.23.0,<1",
    "rich>=14.0.0,<15",
    "pyyaml>=6.0.0,<7",
    "jsonschema>=4.23.0,<5",
    "slowapi>=0.1.9,<1",
    "bcrypt>=5.0.0,<6",
    "cryptography>=48.0.1",
    "textual>=8.0.0,<9",
    "animus-quorum>=1.1.0,<2",
    # Execution primitives owned by Kernel (ADL-20260723-001).
    # Forge executor modules are being migrated to import from Kernel.
    "animus-kernel>=0.1.0,<1",
    # Shared types — sibling package in the monorepo. Editable-installed
    # from ``packages/types/`` during development; satisfied by pip's
    # local resolution when ``packages/types/`` is part of the same
    # ``pip install -e ...`` invocation. Hard requirement: every
    # ``from animus_types import Sensitivity`` site in forge (router,
    # providers/base, network/egress, intelligence/cross_workflow_memory)
    # would crash without it.
    "animus-types>=0.1.0,<1",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9.0"]
mcp = ["mcp>=1.30.0,<2"]
messaging = ["python-telegram-bot>=22.0", "discord-py>=2.3.0"]
browser = ["playwright>=1.40.0"]
local = ["httpx>=0.28.0", "psutil>=7.0.0"]
all = [
    "animus-forge[postgres,mcp,messaging,browser,local]",
]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.15.1",
]

[project.scripts]
animus-forge = "animus_forge.cli:app"

[project.urls]
Homepage = "https://github.com/AreteDriver/animus"
Repository = "https://github.com/AreteDriver/animus"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501", "UP042", "UP046", "UP047"]  # UP042: StrEnum, UP046/UP047: PEP 695 generics

[tool.ruff.lint.per-file-ignores]
"src/animus_forge/api.py" = ["I001"]
"src/animus_forge/coordination/consciousness_bridge.py" = ["F401"]
"src/animus_forge/missions/store.py" = ["F401", "I001"]
"tests/test_sec06_non_memory_logging.py" = ["I001"]
"tests/test_self_improve_engine.py" = ["F841"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["../quorum/python", "src"]
filterwarnings = [
    # The Settings security validator correctly warns at runtime when
    # SECRET_KEY / DATABASE_URL use dev defaults. That is intended app
    # behavior; in the test env it is just noise. Message-matched (not a
    # blanket UserWarning ignore) so genuinely new UserWarnings still surface.
    # NOTE: pytest splits filter specs on ':', so the message regex must not
    # contain a literal colon. The '.' after "Security" matches the real ": ".
    "ignore:Security. SECRET_KEY is using insecure default:UserWarning",
    "ignore:Security. DATABASE_URL is using default SQLite path:UserWarning",
]

[tool.coverage.run]
source = ["src/animus_forge"]
omit = [
    "*/tests/*",
    "*/__main__.py",
    "*/tui/*",
    "*/dashboard/*",
    "*/browser/automation.py",
    "*/messaging/discord_bot.py",
    "*/agents/chainlog_bridge.py",
    "*/api_routes/prompts.py",
    "*/security/request_limits.py",
]

[tool.coverage.report]
# Coverage gate temporarily lowered 97 → 95 following merge of PR #28
# (lugh daily digest) which dropped main to 95.92%. Restoration PRs are
# landing file-by-file (see PR #30 for first batch: +130-170 lines across
# 11 modules). Raise back to 97 once:
#   - webhook_delivery DLQ management tests land (~20 lines)
#   - executor_core sequential-async branches covered (~9 lines)
#   - rate_limited_executor lines 493-499 livelock bug fixed (2 lines)
#   - Remaining 1-4 line scattered gaps across workflow/, state/, tracing/
fail_under = 95
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__",
    "@abstractmethod",
    "raise NotImplementedError",
]
