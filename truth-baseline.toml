[[checks]]
type = "file_exists"
name = "traceability_linter"
paths = ["scripts/traceability_linter.py"]
should_exist = true

[[checks]]
type = "file_exists"
name = "durable_memory_store"
paths = ["packages/kernel/src/animus_kernel/memory/stores/durable.py"]
