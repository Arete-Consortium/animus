[[checks]]
type = "regex_match"
name = "multiarch_docker_platform_binding"
file = ".github/workflows/ci.yml"
pattern = 'platforms: linux/\$\{\{ matrix\.arch \}\}'
group = 0
expected = 'platforms: linux/${{ matrix.arch }}'
op = "=="

[[checks]]
type = "file_exists"
name = "benchmark_profiler_script"
paths = ["scripts/profile_benchmarks.py"]
