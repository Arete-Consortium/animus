[metadata]
name = "animus"

[[checks]]
type = "version_consistency"
name = "version_consistency"
sources = [
    { file = "pyproject.toml", pattern = 'version = "(\d+\.\d+\.\d+)"' },
    { file = "README.md", pattern = 'v(\d+\.\d+\.\d+)' },
    { file = "CLAUDE.md", pattern = '(\d+\.\d+\.\d+)' },
    { file = "packages/core/pyproject.toml", pattern = 'version = "(\d+\.\d+\.\d+)"' },
]

[[checks]]
type = "file_exists"
name = "dead_packages_present"
paths = [
    "packages/arbitrage",
    "packages/bounty",
    "packages/content",
    "packages/faucet",
    "packages/mev",
    "packages/prospector",
    "packages/referral",
    "packages/validator",
]
should_exist = false

[[checks]]
type = "count"
name = "schema_json_files"
glob = "packages/**/*.schema.json"

[[checks]]
type = "file_exists"
name = "adr_directory"
paths = ["adrs/ADR-001.md"]
should_exist = true

[[checks]]
type = "test_count"
name = "core_tests"
command = "python -m pytest -c pyproject.toml packages/core/tests --collect-only"
pattern = '(\d+) tests? collected'
expected = 1
op = ">="

[[checks]]
type = "test_count"
name = "forge_tests"
command = "python -m pytest -c pyproject.toml packages/forge/tests --collect-only"
pattern = '(\d+) tests? collected'
expected = 1
op = ">="

[[checks]]
type = "file_exists"
name = "root_architecture_dirs"
paths = ["apps/", "modules/", "database/", "infra/"]
should_exist = true

[[checks]]
type = "file_exists"
name = "root_architecture_readmes"
paths = [
    "apps/README.md",
    "modules/README.md",
    "database/README.md",
    "infra/README.md",
    "evidence/releases/README.md",
]
should_exist = true

[[checks]]
type = "file_exists"
name = "evidence_directory"
paths = ["evidence/releases/"]
should_exist = true

[[checks]]
type = "file_exists"
name = "adr_coverage"
paths = ["adrs/ADR-001.md", "adrs/ADR-002.md", "adrs/ADR-003.md", "adrs/ADR-004.md", "adrs/ADR-005.md"]
should_exist = true

# NOTE: version_alignment is EXPECTED to FAIL until unified versioning
# is adopted. See COMPATIBILITY_MATRIX.md for documented mismatches.
[[checks]]
type = "version_alignment"
name = "package_version_alignment"
expected_failure = true
[checks.exceptions]
contracts = { has_manifest = false, reason = "pure JSON schemas, no Python package manifest" }

[[checks]]
type = "file_exists"
name = "compatibility_matrix"
paths = ["COMPATIBILITY_MATRIX.md"]
should_exist = true

[[checks]]
type = "compat_check"
name = "cross_package_compatibility"
script = "scripts/check_compatibility.py"

# Phase 2: Durable Core
[[checks]]
type = "file_exists"
name = "initial_migration"
paths = ["database/migrations/versions/001_initial_schema.py"]
should_exist = true

[[checks]]
type = "file_exists"
name = "docker_compose"
paths = ["infra/docker-compose.yml"]
should_exist = true

[[checks]]
type = "file_exists"
name = "infra_env_example"
paths = ["infra/.env.example"]
should_exist = true

[[checks]]
type = "file_exists"
name = "kernel_publish_workflow"
paths = [".github/workflows/publish-kernel.yml"]
should_exist = true

[[checks]]
type = "file_exists"
name = "kernel_changelog"
paths = ["packages/kernel/CHANGELOG.md"]
should_exist = true

[[checks]]
type = "file_exists"
name = "kernel_dockerfile"
paths = ["packages/kernel/Dockerfile"]
