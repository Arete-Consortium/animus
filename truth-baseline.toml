[[checks]]
type = "file_exists"
name = "precommit_ci_job"
paths = [".github/workflows/ci.yml"]
should_exist = true

[[checks]]
type = "regex_match"
name = "benchmark_regression_gate"
file = ".github/workflows/ci.yml"
pattern = "fail-on-alert: true"
expected = "fail-on-alert: true"
op = "=="

[[checks]]
type = "regex_match"
name = "sbom_generation"
